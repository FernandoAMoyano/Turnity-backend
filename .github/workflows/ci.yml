name: CI

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: turnity_ci
          POSTGRES_PASSWORD: turnity_ci
          POSTGRES_DB: turnity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U turnity_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TZ: UTC
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: turnity_ci
      DB_PASSWORD: turnity_ci
      DB_DATABASE: turnity_ci
      DATABASE_URL: postgresql://turnity_ci:turnity_ci@localhost:5432/turnity_ci?schema=public
      # Sin pooler en el Postgres de CI -- misma URL que DATABASE_URL. Ver
      # comentario en schema.prisma / .env.production.example.
      DIRECT_URL: postgresql://turnity_ci:turnity_ci@localhost:5432/turnity_ci?schema=public
      TEST_DATABASE_URL: postgresql://turnity_ci:turnity_ci@localhost:5432/turnity_ci?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_for_testing_only
      JWT_REFRESH_SECRET: ci_refresh_secret_for_testing_only
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      FRONTEND_URL: http://localhost:3000
      MAIL_HOST: smtp.example.com
      MAIL_PORT: 587
      MAIL_USER: ci@example.com
      MAIL_PASSWORD: ci_password_not_real
      MAIL_FROM: noreply@example.com
      MAIL_SECURE: 'false'
      # Verificacion de email + reset de password. EXPOSE_VERIFICATION_TOKENS lo
      # fuerza tests/setup/jest.setup.ts para la suite; aca solo el resto de config.
      EMAIL_VERIFICATION_TOKEN_TTL_HOURS: 24
      PASSWORD_RESET_TOKEN_TTL_MINUTES: 60
      REQUIRE_EMAIL_VERIFICATION: 'true'
      # La suite corre contra la pasarela inerte (NoopPaymentGateway), igual que
      # el entorno de desarrollo: los tests de integracion asertan sus 422 y 401,
      # y ningun test sale a la red. El arranque con Mercado Pago configurado se
      # verifica en un paso propio, despues de la suite.
      PAYMENT_GATEWAY_PROVIDER: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npx prisma db seed

      - name: Run test suite
        run: npm test -- --coverage

      # Arranca la app con Mercado Pago configurado y credenciales ficticias.
      # Confirma que env.ts acepta la configuracion, que el contenedor resuelve
      # MercadoPagoGateway y que el arranque responde /health y /ready sin
      # llamar al proveedor. No prueba ningun comportamiento de Mercado Pago.
      # NODE_ENV=development porque en test el logger esta silenciado, y el
      # log es la unica forma de confirmar cual gateway se resolvio.
      - name: Boot check con la pasarela configurada
        env:
          NODE_ENV: development
          PAYMENT_GATEWAY_PROVIDER: mercadopago
          MERCADOPAGO_ACCESS_TOKEN: TEST-ci-fake-token-not-real
          MERCADOPAGO_WEBHOOK_SECRET: ci_webhook_secret_not_real
          PUBLIC_API_URL: http://localhost:3000
        run: |
          npx tsx src/server.ts > boot.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then break; fi
            sleep 1
          done
          status=0
          BASE_URL=http://localhost:3000 bash scripts/smoke-health.sh || status=1
          if ! grep -q 'MercadoPagoGateway activo' logs/combined.log; then
            echo "::error::El arranque no resolvio MercadoPagoGateway"
            status=1
          fi
          cat boot.log
          exit "$status"

      # Sanity check de la imagen de produccion: sin push, solo
      # confirma que el Dockerfile sigue buildeando -- detecta un Dockerfile
      # roto en el PR, en vez de recien en el deploy (cd.yml).
      - name: Docker build sanity check (imagen de produccion)
        run: docker build --target runtime -t turnity-backend:ci .
